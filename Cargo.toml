[workspace]
resolver = "2"
members = [
    "crates/spm-core",
    "crates/spm-engine",
    "crates/spm-storage",
    "crates/spm-collector-windows",
    "crates/spm-collector-linux",
    "crates/spm-analysis",
    "crates/spm-orchestrator",
    "crates/spm-api",
    "crates/spm-cli",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["SPM Project"]
license = "MIT"
repository = "https://github.com/example/spm"

[workspace.dependencies]
spm-core = { path = "crates/spm-core" }
spm-engine = { path = "crates/spm-engine" }
spm-storage = { path = "crates/spm-storage" }
spm-collector-windows = { path = "crates/spm-collector-windows" }
spm-collector-linux = { path = "crates/spm-collector-linux" }
spm-analysis = { path = "crates/spm-analysis" }
spm-orchestrator = { path = "crates/spm-orchestrator" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "process"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "1"
anyhow = "1"
async-trait = "0.1"
sha2 = "0.10"
rusqlite = { version = "0.31", features = ["bundled", "chrono", "serde_json"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }
sysinfo = "0.30"
clap = { version = "4", features = ["derive"] }
csv = "1"

[profile.release]
opt-level = 3
lto = true
strip = true

[profile.dev]
opt-level = 0
