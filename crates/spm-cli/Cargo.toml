[package]
name = "spm-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Headless capture / query / report CLI for SPM"

[[bin]]
name = "spm"
path = "src/main.rs"

[dependencies]
spm-core.workspace = true
spm-storage.workspace = true
spm-analysis.workspace = true
spm-orchestrator.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true
clap.workspace = true
anyhow.workspace = true
sysinfo.workspace = true

[target.'cfg(windows)'.dependencies]
spm-collector-windows.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
spm-collector-linux.workspace = true
